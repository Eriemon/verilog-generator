<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Verilog Generator RTL workbench</title>
  <desc id="desc">A dark EDA workbench with protocol waveforms and an aligned AXI-Stream packet meter module.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#18303C" stroke-opacity=".42"/>
    </pattern>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2AD4EE"/>
      <stop offset="1" stop-color="#8CE85D"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="560" fill="#060B10"/>
  <rect width="1280" height="560" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1279" height="559" stroke="#1C3948"/>
  <rect x="0" y="0" width="5" height="560" fill="url(#edge)"/>

  <g font-family="Segoe UI, Noto Sans, Arial, sans-serif">
    <text x="44" y="43" fill="#2AD4EE" font-size="13" font-weight="700" letter-spacing="2.2">README.md / RTL WORKBENCH</text>
    <text x="1236" y="43" fill="#91A8B4" font-size="12" text-anchor="end" letter-spacing="1.4">VERILOG-2001 · v0.4.0</text>
    <path d="M24 62H1256" stroke="#1C3948"/>

    <text x="72" y="156" fill="#2AD4EE" font-size="14" font-weight="700" letter-spacing="3.2">VERILOG GENERATOR</text>
    <text x="70" y="232" fill="#E4EDF2" font-size="58" font-weight="750" letter-spacing="-2.4">Verilog-2001 RTL</text>
    <text x="72" y="280" fill="#2AD4EE" font-size="25" font-weight="600" letter-spacing="2">GENERATE · REVIEW · REPAIR · VALIDATE</text>
    <text x="72" y="332" fill="#91A8B4" font-size="20">Readable. Traceable. Verifiable.</text>

    <g font-family="Consolas, SFMono-Regular, monospace" font-size="12" font-weight="700">
      <text x="72" y="404" fill="#8CE85D">/</text>
      <text x="89" y="404" fill="#A9BBC5">RTL MODULE</text>
      <text x="190" y="404" fill="#8CE85D">/</text>
      <text x="207" y="404" fill="#A9BBC5">TESTBENCH</text>
      <text x="310" y="404" fill="#8CE85D">/</text>
      <text x="327" y="404" fill="#A9BBC5">EXISTING RTL</text>
      <text x="454" y="404" fill="#8CE85D">/</text>
      <text x="471" y="404" fill="#A9BBC5">STATIC GATE</text>
    </g>

    <g font-family="Consolas, SFMono-Regular, monospace">
      <rect x="666" y="88" width="558" height="224" fill="#050C12" fill-opacity=".96" stroke="#1C3948"/>
      <rect x="666" y="88" width="558" height="38" fill="#0A151E" stroke="#1C3948"/>
      <text x="684" y="112" fill="#78909C" font-size="11" font-weight="700" letter-spacing="1.6">PROTOCOL VIEW</text>
      <circle cx="1158" cy="107" r="3" fill="#8CE85D"/>
      <text x="1170" y="112" fill="#8CE85D" font-size="11" font-weight="700" letter-spacing="1.3">TRACE</text>

      <g font-size="12" font-weight="600">
        <text x="684" y="157" fill="#718793">axis_aclk</text>
        <text x="684" y="199" fill="#718793">axis_aresetn</text>
        <text x="684" y="237" fill="#718793">tvalid &amp; tready</text>
        <text x="684" y="279" fill="#718793">tlast / packet++</text>
      </g>
      <g stroke-width="2">
        <path d="M824 162H846V143H872V162H898V143H924V162H950V143H976V162H1002V143H1028V162H1054V143H1080V162H1106V143H1132V162H1160" stroke="#2AD4EE"/>
        <path d="M824 204H888V185H1160" stroke="#FFB85C"/>
        <path d="M824 246H936V227H1012V246H1100V227H1140V246H1160" stroke="#8CE85D"/>
        <path d="M824 288H964V269H1044V288H1110V269H1160" stroke="#2AD4EE"/>
      </g>
      <g stroke="#17303D">
        <path d="M684 174H1206M684 216H1206M684 258H1206"/>
      </g>

      <rect x="666" y="334" width="558" height="178" fill="#050C12" fill-opacity=".96" stroke="#1C3948"/>
      <rect x="666" y="334" width="558" height="38" fill="#0A151E" stroke="#1C3948"/>
      <text x="684" y="358" fill="#78909C" font-size="11" font-weight="700" letter-spacing="1.6">MODULE PORTS</text>
      <text x="1206" y="358" fill="#91A8B4" font-size="11" text-anchor="end" letter-spacing="1.3">32-bit AXIS</text>

      <rect x="862" y="398" width="162" height="84" fill="#0A1D27" stroke="#2AD4EE"/>
      <text x="943" y="433" fill="#D9F8FF" font-size="14" font-weight="700" text-anchor="middle">axis_packet</text>
      <text x="943" y="454" fill="#D9F8FF" font-size="14" font-weight="700" text-anchor="middle">meter</text>

      <g fill="#91ACB9" font-size="11.5" font-weight="600">
        <text x="838" y="409" text-anchor="end">i_axis_aclk</text>
        <text x="838" y="431" text-anchor="end">i_axis_arstn</text>
        <text x="838" y="453" text-anchor="end">i_axis_tvalid</text>
        <text x="838" y="475" text-anchor="end">i_axis_tkeep[3:0]</text>
        <text x="1050" y="409">i_axis_tready</text>
        <text x="1050" y="431">i_axis_tlast</text>
        <text x="1050" y="453">o_packet_count[31:0]</text>
        <text x="1050" y="475">o_byte_count[31:0]</text>
      </g>
      <g stroke="#2D6377">
        <path d="M844 405H862M844 427H862M844 449H862M844 471H862"/>
        <path d="M1024 405H1042M1024 427H1042M1024 449H1042M1024 471H1042"/>
      </g>
    </g>
  </g>
</svg>
