<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-labelledby="title desc">
  <title id="title">Verilog Generator authors</title>
  <desc id="desc">Signal-node cards for Jiyuan Liu and He Li from Southeast University.</desc>

  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#102B38" stroke-width="1" opacity=".48"/>
    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C202B"/>
      <stop offset="1" stop-color="#051018"/>
    </linearGradient>
    <filter id="cyanGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="330" fill="#03080D"/>
  <rect width="1280" height="330" fill="url(#grid)"/>
  <rect x="16" y="16" width="1248" height="298" fill="#040D13" fill-opacity=".92" stroke="#183543"/>

  <rect x="16" y="16" width="1248" height="48" fill="#09151D" stroke="#183543"/>
  <rect x="34" y="31" width="5" height="18" fill="#25D9F2" filter="url(#cyanGlow)"/>
  <text x="52" y="47" fill="#D9EDF5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="2">AUTHOR NODES</text>
  <circle cx="1160" cy="40" r="4" fill="#8CF06B" filter="url(#cyanGlow)"/>
  <text x="1173" y="44" fill="#8CF06B" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.2">VERIFIED</text>

  <g>
    <rect x="40" y="82" width="586" height="182" fill="url(#panel)" stroke="#1A4050"/>
    <path d="M548 82H626V142" fill="none" stroke="#25D9F2" stroke-opacity=".32"/>
    <path d="M581 235H626V264H526" fill="none" stroke="#25D9F2" stroke-opacity=".18"/>
    <path d="M62 104H116V158H62Z" fill="#25D9F2"/>
    <path d="M62 104H74M62 104V116M116 146V158H104" fill="none" stroke="#D9EDF5" stroke-width="2" opacity=".7"/>
    <text x="89" y="137" text-anchor="middle" fill="#031015" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="900">JL</text>
    <text x="142" y="108" fill="#7895A2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.8">AUTHOR / 01</text>
    <text x="142" y="143" fill="#D9EDF5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="800">Jiyuan Liu</text>
    <text x="142" y="172" fill="#9DB6C1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">School of Electronic Science and Engineering</text>
    <text x="142" y="194" fill="#9DB6C1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Heterogeneous Intelligence and Quantum Computing Laboratory</text>
    <rect x="142" y="215" width="198" height="30" fill="#061019" stroke="#285468"/>
    <text x="156" y="235" fill="#8CF06B" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="800">@</text>
    <text x="174" y="235" fill="#D9EDF5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="650"><REDACTED_EMAIL></text>
  </g>

  <g>
    <rect x="654" y="82" width="586" height="182" fill="url(#panel)" stroke="#1A4050"/>
    <path d="M1162 82H1240V142" fill="none" stroke="#8CF06B" stroke-opacity=".32"/>
    <path d="M1195 235H1240V264H1140" fill="none" stroke="#8CF06B" stroke-opacity=".18"/>
    <path d="M676 104H730V158H676Z" fill="#8CF06B"/>
    <path d="M676 104H688M676 104V116M730 146V158H718" fill="none" stroke="#D9EDF5" stroke-width="2" opacity=".7"/>
    <text x="703" y="137" text-anchor="middle" fill="#031015" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="900">HL</text>
    <text x="756" y="108" fill="#7895A2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.8">AUTHOR / 02</text>
    <text x="756" y="143" fill="#D9EDF5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="800">He Li</text>
    <text x="756" y="172" fill="#9DB6C1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">School of Electronic Science and Engineering</text>
    <text x="756" y="194" fill="#9DB6C1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Heterogeneous Intelligence and Quantum Computing Laboratory</text>
    <rect x="756" y="215" width="205" height="30" fill="#061019" stroke="#285468"/>
    <text x="770" y="235" fill="#8CF06B" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="800">@</text>
    <text x="788" y="235" fill="#D9EDF5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="650"><REDACTED_EMAIL></text>
  </g>

  <rect x="40" y="278" width="1200" height="20" fill="#061019" stroke="#183543"/>
  <text x="54" y="292" fill="#7895A2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1">SOUTHEAST UNIVERSITY / SCHOOL OF ELECTRONIC SCIENCE AND ENGINEERING</text>
  <text x="1226" y="292" text-anchor="end" fill="#8CF06B" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1">HIQC LABORATORY</text>
</svg>
